<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFL Playbook — HOME vs VISITORS · WR · TE · RB</title>
  <meta name="description" content="Terrain NFL interactif : les 3 postes offensifs (WR, TE, RB) de l'équipe locale et de l'équipe extérieure, avec fiches tactiques style carte FIFA pour coachs." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>

  <!-- ===================== BARRE SUPÉRIEURE ===================== -->
  <header class="topbar">
    <nav class="topnav">
      <span class="nav-item active" id="navPlaybook">🏈 PLAYBOOK</span>
      <span class="nav-item" id="navAnalytics">📊 ANALYTICS</span>
    </nav>
    <div class="topnav-right">
      <!-- Sélecteur de match (rempli depuis games.csv via games.js) -->
      <div class="game-picker">
        <label class="gp-field">
          <span>SEMAINE</span>
          <select id="weekSelect" aria-label="Choisir la semaine"></select>
        </label>
        <label class="gp-field">
          <span>MATCH</span>
          <select id="gameSelect" aria-label="Choisir le match"></select>
        </label>
      </div>
    </div>
  </header>

  <!-- ===================== VUE TERRAIN ===================== -->
  <main id="fieldView" class="field-view" aria-label="Terrain — sélection des postes">

    <!-- Panneaux d'info coin gauche / droite (style playbook) -->
    <aside class="hud hud-left">
      <div class="hud-box"><span class="hud-label">OFFENSE</span><span class="hud-val">I-Formation</span></div>
      <div class="hud-box roster-box" id="rosterHome"></div>
    </aside>
    <aside class="hud hud-right">
      <div class="hud-box"><span class="hud-label">DEFENSE</span><span class="hud-val">4-3 Cover 2</span></div>
      <div class="hud-box roster-box" id="rosterAway"></div>
    </aside>

    <!-- Le terrain, vue du dessus -->
    <div class="field-wrap">
      <div class="field">
        <div class="field-turf">
          <!-- lignes de yards + numéros générés en CSS/JS -->
          <div class="yardlines" id="yardlines"></div>
          <div class="endzone endzone-left"></div>
          <div class="endzone endzone-right"></div>
          <div class="midlogo">🏈</div>

          <!-- bandeaux d'équipe : HOME à gauche, VISITOR à droite -->
          <div class="team-banner banner-left"  id="bannerHome"></div>
          <div class="team-banner banner-right" id="bannerAway"></div>

          <!-- pastilles joueurs : injectées par JS -->
          <div class="players-home" id="playersHome"></div>
          <div class="players-away" id="playersAway"></div>
        </div>
      </div>
      <p class="field-hint" id="fieldHint">Choisissez un match, puis cliquez sur un joueur (WR · TE · RB) pour zoomer — <span>Domicile à gauche · Extérieur à droite</span></p>
    </div>
  </main>

  <!-- ===================== VUE DÉTAIL (ZOOM) ===================== -->
  <section id="detail" class="detail" aria-hidden="true">
    <button class="back-btn" id="backBtn" aria-label="Retour au terrain">← Retour au terrain</button>
    <div class="detail-inner" id="detailInner"></div>
  </section>

  <footer class="footer">
    <p>Outil d'aide à l'évaluation — données illustratives, barème 0–99 (style <em>Ultimate Team</em>).</p>
  </footer>

  <script src="games.js?v=5"></script>
  <script src="data.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
